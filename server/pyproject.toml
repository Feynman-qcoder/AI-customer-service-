[project]
name = "zhifutong-agent-server"
version = "0.1.0"
description = "智服通 Agent Python FastAPI backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "sqlalchemy[asyncio]==2.0.41",
    "aiomysql==0.2.0",
    "PyMySQL==1.2.0",
    "cryptography==49.0.0",
    "alembic==1.16.4",
    "PyJWT==2.10.1",
    "passlib[bcrypt]==1.7.4",
    "redis==6.2.0",
    "qdrant-client==1.13.3",
    "langgraph==0.5.4",
    "langgraph-checkpoint-sqlite==2.0.11",
    "aiosqlite==0.21.0",
    "langchain-core==0.3.72",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "pypdf==6.14.2",
    "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.4",
    "mypy==1.17.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP046"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
